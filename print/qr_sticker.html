<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>1000km FUJI ’86 — QR sticker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&display=swap">
<link rel="stylesheet" href="card.css">
<style>
  :root { --w:80mm; --h:80mm; }
  .page { background:var(--black); align-items:center; justify-content:center; gap:3mm; }
  .t { font:900 13pt/1 var(--sans); color:var(--yellow); letter-spacing:.02em; }
  .qr { width:50mm; height:50mm; }
  .cta { color:#fff; font-size:9pt; margin-top:0; }
</style>
</head>
<body>
<div class="page">
  <p class="t">1000km FUJI ’86</p>
  <img class="qr" src="../qr.svg" alt="QR">
  <p class="cta">このポスターの物語を読む</p>
</div>
</body>
</html>
